name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile + migrations + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Alembic migrations (upgrade + downgrade)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic downgrade base
          rm -f ci_migrations.db

      - name: Smoke test suites
        run: python tests/run_smoke.py

      # Runs against the mock provider, so this does not measure model accuracy
      # and the thresholds are deliberately wide. What it catches is a scoring
      # path that has broken or drifted hard: a prompt edit that stops parsing,
      # rounding that silently disappears, a scorer that collapses to a
      # constant. Tightening these would only pin the stub's own behaviour.
      - name: Scoring eval (mock provider)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_evals.db
        run: python -m evals --max-mae 1.5 --max-bias 1.0

  journey:
    name: E2E user journey (live API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start API
        env:
          DATABASE_URL: sqlite+aiosqlite:///./journey_ci.db
        run: |
          uvicorn main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health || (cat /tmp/api.log; exit 1)

      - name: Run user journey
        run: node tests/journey/journey_check.js http://localhost:8000/v1

      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log

  frontend:
    name: Frontend (lint + typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # --max-warnings 0, so a warning fails the build rather than
        # accumulating until nobody reads the output.
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      # Bundling proves every import resolves and the whole tree compiles for
      # release — errors that a typecheck alone cannot catch.
      - name: Bundle (Android)
        run: npm run bundle:android

      # The fixtures are unreachable in release (`__DEV__` is false) but a
      # static import bundles them anyway, so ~14 KB of invented essays and
      # bands shipped to every device. A production Babel alias swaps them for
      # a stub; this asserts the swap actually happened, because the failure
      # mode is silent -- the app works either way.
      - name: Release bundle carries no fixture data
        run: |
          bundle=.bundle-check/index.android.bundle
          fail=0
          # Content markers, not export names: the stub re-declares every
          # export name, so those legitimately survive. The invented essays,
          # bands and feedback are the payload that must not ship.
          grep -qF "The Impact of Global Warming on Coastal Cities." "$bundle" && { echo "Fixture essay prompt found in release bundle"; fail=1; }
          grep -qF "Use cohesive devices like" "$bundle" && { echo "Fixture feedback text found in release bundle"; fail=1; }
          [ "$fail" -eq 0 ] && echo "No fixture data in the release bundle."
          exit $fail

  docker:
    name: Docker (build + health check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ai-ielts-backend ./backend

      - name: Run container and verify /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db \
            ai-ielts-backend
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json 2>/dev/null; then
              ok="yes"; break
            fi
            sleep 2
          done
          # Readiness and metrics are checked in the container too, not only
          # under TestClient: both depend on middleware order and on a real
          # database connection, and neither is exercised by /health.
          curl -fsS http://localhost:8000/ready > /tmp/ready.json || true
          curl -fsS http://localhost:8000/metrics > /tmp/metrics.txt || true
          echo "--- container logs ---"; docker logs api | tail -30
          docker rm -f api > /dev/null
          if [ -z "$ok" ]; then echo "health check failed"; exit 1; fi
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"ready":true' /tmp/ready.json
          grep -q '"name":"database"' /tmp/ready.json
          grep -q 'http_requests_total' /tmp/metrics.txt
          # The route label must be a template. If a raw path ever appears here
          # the cardinality guard has regressed.
          grep -q 'route="/ready"' /tmp/metrics.txt
