name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compile + migrations + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Alembic migrations (upgrade + downgrade)
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic downgrade base
          rm -f ci_migrations.db

      - name: Smoke test suites
        run: python tests/run_smoke.py

  journey:
    name: E2E user journey (live API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start API
        env:
          DATABASE_URL: sqlite+aiosqlite:///./journey_ci.db
        run: |
          uvicorn main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health || (cat /tmp/api.log; exit 1)

      - name: Run user journey
        run: node tests/journey/journey_check.js http://localhost:8000/v1

      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # Bundling proves every import resolves and the whole tree compiles for
      # release — errors that a typecheck alone cannot catch.
      - name: Bundle (Android)
        run: npm run bundle:android

      - name: Bundle (iOS)
        run: npm run bundle:ios

  docker:
    name: Docker (build + health check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ai-ielts-backend ./backend

      - name: Run container and verify /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db \
            ai-ielts-backend
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json 2>/dev/null; then
              ok="yes"; break
            fi
            sleep 2
          done
          echo "--- container logs ---"; docker logs api | tail -30
          docker rm -f api > /dev/null
          if [ -z "$ok" ]; then echo "health check failed"; exit 1; fi
          grep -q '"status":"ok"' /tmp/health.json
