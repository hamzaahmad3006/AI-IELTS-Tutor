# Local development stack: FastAPI backend + PostgreSQL + LiveKit.
#   docker compose up --build
# API on http://localhost:8000 (docs at /docs). Migrations run on startup.
# LiveKit signalling on ws://localhost:7880.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aitutor
      POSTGRES_PASSWORD: aitutor
      POSTGRES_DB: aitutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitutor -d aitutor"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://aitutor:aitutor@db:5432/aitutor
      JWT_SECRET: dev_secret_change_me
      AI_PROVIDER: groq
      # GROQ_API_KEY: set to enable real AI (otherwise the offline mock is used)
      RATE_LIMIT_ENABLED: "true"
      # Matches the --dev server above. Overridden by .env in any real
      # deployment, where the secret must be generated rather than published.
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  # Self-hosted LiveKit. --dev runs a single node with the well-known
  # devkey/secret pair and no TLS, which is right for a laptop and wrong for
  # anything else: those credentials are published in LiveKit's own docs, so a
  # dev-mode server reachable from outside the machine is an open server.
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      # Signalling (WebSocket). The RN client connects here.
      - "7880:7880"
      # TURN/TCP fallback for networks that block UDP.
      - "7881:7881"
      # RTC media. A range, because each participant gets its own port, and
      # UDP is what makes the latency worth having in the first place.
      - "50000-50100:50000-50100/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
